[package]
name = "adaliszk-prelude"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared configuration types, YAML config parsing, and an opinionated tracing setup."
keywords = ["config", "tracing", "logging", "prelude", "foundation"]
categories = ["config", "development-tools"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
path = "source/lib.rs"

[dependencies]
adaliszk-prelude-macros = { path = "./macros", version = "0.3.0" }
glob = { version = "0.3" }
serde.workspace = true
serde_json = { version = "1.0" }
serde_norway = { version = "0.9" }
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true
toml = { version = "0.9" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = { version = "0.2" }

[dev-dependencies]
rstest.workspace = true
googletest.workspace = true

[package.metadata.release]
shared-version = "prelude"
