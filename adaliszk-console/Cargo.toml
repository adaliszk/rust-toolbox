[package]
name = "adaliszk-console"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A small command framework over clap and inventory with compile-time registration."
keywords = ["cli", "clap", "inventory", "command", "console"]
categories = ["command-line-interface", "development-tools"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
path = "source/lib.rs"

[dependencies]
adaliszk-prelude = { path = "../adaliszk-prelude", version = "0.1.3" }
adaliszk-console-macros = { path = "./macros", version = "0.1.1" }
async-trait.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
inventory.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
googletest.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
tokio.workspace = true

[package.metadata.release]
shared-version = "console"
