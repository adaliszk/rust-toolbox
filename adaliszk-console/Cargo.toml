[package]
name = "adaliszk-console"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clap front-end for adaliszk-commands: builds the CLI, parses arguments, and binds them into the DI container."
keywords = ["cli", "clap", "inventory", "command", "console"]
categories = ["command-line-interface", "development-tools"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
path = "source/lib.rs"

[dependencies]
adaliszk-commands = { path = "../adaliszk-commands", version = "0.1.1" }
adaliszk-console-macros = { path = "./macros", version = "0.3.1" }
adaliszk-prelude = { path = "../adaliszk-prelude", version = "0.3.0" }
clap = { version = "4.6", features = ["derive", "env"] }
inventory.workspace = true
serde.workspace = true

[dev-dependencies]
# The `Resolvable` derive (via #[console_args]) expands to `::adaliszk_anymap::` paths:
adaliszk-anymap = { path = "../adaliszk-anymap" }
rstest.workspace = true
googletest.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
tokio.workspace = true

[package.metadata.release]
shared-version = "console"
