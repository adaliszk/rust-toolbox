[package]
name = "adaliszk-prelude-macros"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural-macro companion for adaliszk-prelude."
keywords = ["macros", "proc-macro", "prelude", "workspace", "tracing"]
categories = ["development-tools::procedural-macro-helpers"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
proc-macro = true
path = "source/lib.rs"

[dependencies]
quote = { version = "1.0" }
cargo_metadata = { version = "0.23" }

[dev-dependencies]
googletest.workspace = true

[package.metadata.release]
shared-version = "prelude"
