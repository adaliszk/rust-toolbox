[package]
name = "adaliszk-events-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural-macro companion for adaliszk-events (the event and listen attributes)."
keywords = ["macros", "proc-macro", "events", "inventory", "di"]
categories = ["development-tools::procedural-macro-helpers"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
proc-macro = true
path = "source/lib.rs"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
# The doctests expand to these crates' paths, like any application using the macros:
adaliszk-anymap = { path = "../../adaliszk-anymap" }
adaliszk-events = { path = ".." }
tokio.workspace = true
trybuild.workspace = true

[package.metadata.release]
shared-version = "events"
