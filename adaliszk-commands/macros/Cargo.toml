[package]
name = "adaliszk-commands-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural-macro companion for adaliszk-commands (the command registration attribute)."
keywords = ["macros", "proc-macro", "command", "inventory", "di"]
categories = ["development-tools::procedural-macro-helpers"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[lib]
proc-macro = true
path = "source/lib.rs"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
adaliszk-anymap = { path = "../../adaliszk-anymap" } # the Resolvable derive expands to its paths
adaliszk-commands = { path = ".." }
trybuild = "1.0"

[package.metadata.release]
shared-version = "commands"
