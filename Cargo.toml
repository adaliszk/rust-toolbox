[workspace]
resolver = "3"
members = [
    "adaliszkfmt",
    "adaliszk-anymap/macros",
    "adaliszk-anymap",
    "adaliszk-prelude/macros",
    "adaliszk-prelude",
    "adaliszk-console/macros",
    "adaliszk-console",
    # "adaliszk-commands/macros",
    # "adaliszk-commands",
]

[workspace.metadata.release]
shared-version = true
consolidate-commits = false
tag-name = "{{crate_name}}@v{{version}}"
pre-release-commit-message = "chore({{crate_name}}): release v{{version}}"
publish = true # FUTURE: turn into `false` when automation introduced
push = true

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.100"

[workspace.dependencies]
async-trait = { version = "0.1" }
inventory = { version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "2.0" }
tokio = { version = "1.54", features = ["full"] }
tracing = { version = "0.1" }
rstest = { version = "0.29" }
googletest = { version = "0.14" }
