[package]
name = "adaliszkfmt"
version = "0.1.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Drop-in rustfmt shim that bundles a personal style with nightly provisioning."
keywords = ["rustfmt", "formatting", "custom-configuration", "opinionated"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://codeberg.org/adaliszk/rust-toolbox"
readme = "README.md"

[[bin]]
name = "adaliszkfmt"
path = "source/main.rs"

[package.metadata.release]
shared-version = false
release = false
